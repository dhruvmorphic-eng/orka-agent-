<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orka</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body><main class="chat"><header><a class="brand" href="/" aria-label="Orka home"><svg class="brand-mark" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="19" cy="5" r="3" fill="currentColor" stroke="#101010" stroke-width="2"/></svg>orka</a><div class="header-actions"><button id="history-button" title="Saved conversations">History</button><button id="new-chat" title="New conversation">New chat</button><button id="toggle-activity" aria-expanded="true" aria-controls="activity-panel">Activity</button></div></header>
<nav id="history" hidden aria-label="Saved conversations"></nav>
<div id="scroll"><section id="welcome"><h1>What can I help with?</h1><p>Tell me who you want to reach.</p></section><section id="messages" aria-label="Conversation" aria-live="polite"></section><div id="pending" hidden><span class="pulse"></span> <span id="pending-text">Understanding your request</span></div></div>
<div class="composer-wrap"><div id="error" role="alert" hidden></div><form id="composer"><label class="sr-only" for="prompt">Message Orka</label><textarea id="prompt" rows="1" maxlength="4000" placeholder="Message Orka…" required></textarea><div class="composer-bottom"><span id="connection">Connecting…</span><button id="send" type="submit" aria-label="Send message">↑</button></div></form></div></main>
<aside id="activity-panel" class="activity"><header><span><i class="status-dot"></i> Live activity</span></header><div id="activity-scroll"><div id="logs" role="log" aria-live="polite"></div><div id="plan-code" hidden><div class="code-divider">search-plan.json</div><pre id="plan-json"></pre></div><div id="idle"><span class="code-comment">// Waiting for your first request</span><span class="cursor">▍</span></div></div><footer><span id="task-status">No active task</span></footer></aside></body></html>
